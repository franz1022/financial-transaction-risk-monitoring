services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    image: financial-risk-monitoring:latest
    container_name: fraud-risk-api

    command:
      - python
      - -m
      - uvicorn
      - app.api:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"

    ports:
      - "8000:8000"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile

    image: financial-risk-monitoring:latest
    container_name: fraud-risk-dashboard

    command:
      - python
      - -m
      - streamlit
      - run
      - app/dashboard.py
      - --server.address
      - 0.0.0.0
      - --server.port
      - "8501"
      - --server.headless
      - "true"

    ports:
      - "8501:8501"

    environment:
      API_BASE_URL: http://api:8000

    depends_on:
      api:
        condition: service_healthy

    restart: unless-stopped